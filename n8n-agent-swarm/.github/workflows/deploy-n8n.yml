name: Deploy n8n Agent Swarm

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

env:
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate workflow JSON
        run: |
          echo "🔍 Validating workflow structure..."
          node scripts/validate-workflow.js

      - name: Check for syntax errors
        run: |
          echo "🔍 Checking JavaScript syntax..."
          find scripts -name "*.js" -exec node --check {} \;

      - name: Lint workflow file
        run: |
          echo "🔍 Linting workflow file..."
          if command -v jq &> /dev/null; then
            jq empty n8n-workflows/main-workflow.json
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          echo "🧪 Running tests..."
          # npm test
          echo "✅ Tests would run here"

      - name: Test workflow import
        run: |
          echo "🧪 Testing workflow import script..."
          node -e "const {loadWorkflow} = require('./scripts/validate-workflow'); loadWorkflow();"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ secrets.N8N_STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy to n8n staging
        env:
          N8N_INSTANCE_URL: ${{ secrets.N8N_STAGING_URL }}
          N8N_API_KEY: ${{ secrets.N8N_STAGING_API_KEY }}
        run: |
          echo "🚀 Deploying to staging..."
          node scripts/deploy-workflow.js

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment to Staging Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open n8n Staging](${{ secrets.N8N_STAGING_URL }})" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/production' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ secrets.N8N_PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Create backup
        env:
          N8N_INSTANCE_URL: ${{ secrets.N8N_PRODUCTION_URL }}
          N8N_API_KEY: ${{ secrets.N8N_PRODUCTION_API_KEY }}
        run: |
          echo "💾 Creating backup before deployment..."
          mkdir -p backups
          # Add backup logic here

      - name: Deploy to n8n production
        env:
          N8N_INSTANCE_URL: ${{ secrets.N8N_PRODUCTION_URL }}
          N8N_API_KEY: ${{ secrets.N8N_PRODUCTION_API_KEY }}
        run: |
          echo "🚀 Deploying to production..."
          node scripts/deploy-workflow.js

      - name: Verify deployment
        env:
          N8N_INSTANCE_URL: ${{ secrets.N8N_PRODUCTION_URL }}
        run: |
          echo "✅ Verifying deployment..."
          curl -f $N8N_INSTANCE_URL/healthz || exit 1

      - name: Create deployment summary
        run: |
          echo "## 🎉 Deployment to Production Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open n8n Production](${{ secrets.N8N_PRODUCTION_URL }})" >> $GITHUB_STEP_SUMMARY

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          # Add Slack/Discord notification here if needed

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Consider rollback."
          # Add rollback logic here
