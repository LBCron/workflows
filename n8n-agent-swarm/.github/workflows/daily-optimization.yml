name: Daily Optimization

# Run daily to analyze performance and suggest improvements
on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2 AM UTC
  workflow_dispatch:

jobs:
  analyze-and-optimize:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: |
          cd n8n-agent-swarm
          npm install

      - name: 🧠 Run Learning System Analysis
        id: learn
        run: |
          cd n8n-agent-swarm
          npm run learn -- --period=7 > learning-report.txt
          cat learning-report.txt

      - name: 📊 Generate Performance Report
        run: |
          cd n8n-agent-swarm
          npm run analyze

      - name: 🔮 Identify Optimization Opportunities
        id: optimize
        run: |
          cd n8n-agent-swarm

          # Check if any agents have success rate < 95%
          NEEDS_OPTIMIZATION=false

          # For now, this is a placeholder
          # In production, this would parse learning-report.txt
          # and identify agents that need optimization

          echo "needs_optimization=$NEEDS_OPTIMIZATION" >> $GITHUB_OUTPUT

      - name: 🧪 Generate and Test Prompt Variants
        if: steps.optimize.outputs.needs_optimization == 'true'
        run: |
          cd n8n-agent-swarm

          # Generate variants for agents that need optimization
          # Example: npm run optimize -- --agent=email --generate
          echo "Generating prompt variants..."

      - name: 📝 Create Optimization PR
        if: steps.optimize.outputs.needs_optimization == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: Auto-optimize agent prompts based on learning analysis'
          branch: auto-optimization-${{ github.run_number }}
          title: '🤖 Auto-Optimization: Improve Agent Performance'
          body: |
            ## 🧠 Automated Optimization PR

            This PR contains automated optimizations generated by the Learning System.

            ### 📊 Analysis Period
            Last 7 days

            ### 🎯 Optimizations Included
            - Improved prompts for underperforming agents
            - A/B tested variants with positive results
            - Token usage optimizations

            ### 📈 Expected Impact
            - Improved success rates
            - Reduced response times
            - Lower token costs

            ### ✅ Validation
            All optimizations have been tested and show improvement over baseline.

            **Auto-generated by**: Daily Optimization Workflow
            **Run ID**: ${{ github.run_id }}

      - name: 🔔 Send Daily Report to Telegram
        if: secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          MESSAGE="📊 *Daily Learning Report*

Period: Last 24 hours

🎯 *Performance Overview:*
• Total Interactions: N/A (implement logging)
• Success Rate: N/A
• Avg Response Time: N/A

🔍 *Key Insights:*
• Analysis pending (set up logging)

📋 *Recommendations:*
• Configure Google Sheets logging
• Enable metrics collection

[View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
