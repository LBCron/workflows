# Fly.io Configuration for AI Agent Swarm Telegram Bot
# Deploy with: fly deploy

app = "n8n-agent-swarm"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

# Secrets à configurer via: fly secrets set KEY=VALUE
# Required:
# - TELEGRAM_BOT_TOKEN (get from @BotFather)
# - OPENAI_API_KEY (for GPT-4 Mini)
#
# Optional (pour multi-model intelligent router):
# - ANTHROPIC_API_KEY (for Claude)
# - GROQ_API_KEY (for Llama 3 - FREE)
# - GOOGLE_API_KEY (for Gemini)
#
# Configuration:
# - MONTHLY_BUDGET_EUR=20 (budget mensuel max)
# - DEFAULT_MODEL=gpt-4o-mini (forcer un seul modèle)

# VM Resources - Ultra-léger pour bot Telegram
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Auto-scaling
[scaling]
  min_machines = 1
  max_machines = 1

# Restart policy
[restart]
  policy = "on-failure"
  max_retries = 10
