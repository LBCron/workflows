# Fly.io Configuration for n8n Agent Swarm
# Deploy with: fly deploy

app = "n8n-agent-swarm"
primary_region = "cdg"  # Paris

[build]
  image = "n8nio/n8n:latest"

[env]
  # n8n Configuration
  N8N_HOST = "0.0.0.0"
  N8N_PORT = "5678"
  N8N_PROTOCOL = "https"
  N8N_LOG_LEVEL = "info"
  GENERIC_TIMEZONE = "Europe/Paris"

  # Database
  DB_TYPE = "postgresdb"

  # Execution settings
  EXECUTIONS_TIMEOUT = "300"
  EXECUTIONS_TIMEOUT_MAX = "600"
  EXECUTIONS_DATA_PRUNE = "true"
  EXECUTIONS_DATA_MAX_AGE = "168"  # 7 days

  # Features
  N8N_AI_ENABLED = "true"
  N8N_METRICS = "true"

  # Webhook URL (will be auto-set to your Fly.io URL)
  WEBHOOK_URL = "https://n8n-agent-swarm.fly.dev"

# Secrets to set via: fly secrets set KEY=VALUE
# - N8N_BASIC_AUTH_USER
# - N8N_BASIC_AUTH_PASSWORD
# - DB_POSTGRESDB_HOST
# - DB_POSTGRESDB_PORT
# - DB_POSTGRESDB_DATABASE
# - DB_POSTGRESDB_USER
# - DB_POSTGRESDB_PASSWORD
# - TELEGRAM_BOT_TOKEN
# - OPENROUTER_API_KEY
# - OPENAI_API_KEY
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - GOOGLE_SHEET_ID
# - YOUTUBE_API_KEY
# - TAVILY_API_KEY
# - PERPLEXITY_API_KEY
# - OPENWEATHERMAP_API_KEY

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "10s"
  path = "/healthz"

# Persistent volume for n8n data
[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"
  initial_size = "10gb"

# VM Resources
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Auto-scaling (optional)
[scaling]
  min_count = 1
  max_count = 2

# Restart policy
[restart]
  policy = "on-failure"
  max_retries = 10
