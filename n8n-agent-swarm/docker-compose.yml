version: '3.8'

services:
  # PostgreSQL Database for n8n
  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-agent-swarm
    restart: unless-stopped
    ports:
      - '${N8N_PORT:-5678}:5678'
    environment:
      # Basic Auth (optional, can use OAuth instead)
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}

      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_postgres_password}

      # Webhook URL (change to your domain in production)
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}

      # Timezone
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Paris}

      # Execution settings
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=${EXECUTIONS_TIMEOUT:-300}
      - EXECUTIONS_TIMEOUT_MAX=${EXECUTIONS_TIMEOUT_MAX:-600}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console

      # AI Features
      - N8N_AI_ENABLED=true

      # Security
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}

      # Personalization (optional)
      - N8N_PERSONALIZATION_ENABLED=true

      # License (if you have one)
      # - N8N_LICENSE_CERT=your_license_here

    volumes:
      # Persist n8n data
      - n8n_data:/home/node/.n8n

      # Mount workflows for easy access
      - ./n8n-workflows:/workflows:ro

      # Mount scripts for import/export
      - ./scripts:/scripts:ro

      # Mount logs
      - ./logs:/logs

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Qdrant Vector Database (for advanced AI features)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: n8n-qdrant
  #   restart: unless-stopped
  #   ports:
  #     - '6333:6333'
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks:
  #     - n8n-network

  # Optional: Redis for caching (for high-traffic deployments)
  # redis:
  #   image: redis:7-alpine
  #   container_name: n8n-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - n8n-network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  # qdrant_data:
  #   driver: local
  # redis_data:
  #   driver: local

networks:
  n8n-network:
    driver: bridge

# Production notes:
# 1. Change WEBHOOK_URL to your actual domain
# 2. Set strong passwords for N8N_PASSWORD and POSTGRES_PASSWORD
# 3. Enable HTTPS (use reverse proxy like Nginx or Traefik)
# 4. Configure proper backup strategy for volumes
# 5. Set up monitoring and logging
# 6. Use secrets management instead of .env file
